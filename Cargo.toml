[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Type an app idea, watch it pass its checks, get a working Rust app."
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
regex = "1"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
