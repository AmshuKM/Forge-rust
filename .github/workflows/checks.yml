name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: cargo test
      - name: Helper library tests
        run: cargo test --manifest-path sdk/Cargo.toml
      - name: Sample app tests
        run: |
          cargo test --offline --manifest-path apps/slugify/Cargo.toml
          cargo test --offline --manifest-path apps/docqa/Cargo.toml
      - name: Build Forge and score a sample app with it
        run: cargo run --release -- eval slugify

  sandbox:
    name: real sandbox (Linux, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test, score and scan a sample app inside the sandbox
        run: cargo test -- --ignored
